<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Reservation confirmed</title>
  </head>
  <body>
    <h1>Reservation confirmed</h1>
    <p>Reservation number: {{ reservation.pk }}</p>
    <p>Guest: {{ reservation.guest }}</p>
    <p>
      {{ reservation.room.hotel.name }} — room {{ reservation.room.room_number }}
    </p>
    <p>{{ reservation.check_in }} to {{ reservation.check_out }}</p>
    <a href="{% url 'hospitality:availability' %}">Create another reservation</a>
  </body>
</html>
